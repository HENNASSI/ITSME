<script>
function generate() {
    const raw = document.getElementById("input").value
        .split("\n")
        .map(l => l.trim())
        .filter(l => l && !/^\d+\.$/.test(l));

    let html = "<table>";
    let i = 1;

    for (let x = 0; x < raw.length; x += 2) {
        const name = raw[x] || "";
        const code = raw[x + 1] || "";

        html += `
        <tr>
            <td class="name">${i}. ${name}</td>
            <td class="code">${code}</td>
        </tr>`;
        i++;
    }

    html += "</table>";
    document.getElementById("output").innerHTML = html;
}
</script>
