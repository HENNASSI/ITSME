<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CHARCHABIL LM9AWED</title>

<style>
body {
    font-family: "Aptos Serif", serif;
    background: #ffffff;
    padding: 20px;
}

h3 {
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 200px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    font-size: 12pt;
    width: 100%;
}

td {
    padding: 2px 0;
    vertical-align: top;
}

.name {
    width: 75%;
}

.code {
    width: 25%;
    text-align: left;
}
</style>
</head>

<body>

<h3>CHARCHABIL LM9AWED</h3>

<textarea id="input" placeholder="DIR DIK L3AYBA LI KAT3RAF DIR DIMA CTRL+V"></textarea>
<br>
<button onclick="generate()">Generate</button>
<button onclick="copyResult()">Copy for Outlook</button>

<div id="output"></div>

<script>
function generate() {
    const lines = document.getElementById("input").value
        .split("\n")
        .map(l => l.trim())
        .filter(l => l);

    let html = "<table>";
    let i = 1;

    lines.forEach(line => {
        line = line.replace(/^\d+\./, "").trim();

        const parts = line.split(/\s+/);

        const code = parts.pop();

        const name = parts.join(" ");

        html += `
        <tr>
            <td class="name">${i}. ${name}</td>
            <td class="code">${code}</td>
        </tr>`;
        i++;
    });

    html += "</table>";
    document.getElementById("output").innerHTML = html;
}

function copyResult() {
    const range = document.createRange();
    range.selectNode(document.getElementById("output"));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
    window.getSelection().removeAllRanges();
    alert("✔ Copied! Paste it directly in Outlook Desktop.");
}
</script>

</body>
</html>
