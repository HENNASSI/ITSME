<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CHARCHABIL LM9EWD</title>

<style>
    
body {
    background: radial-gradient(circle at top, #1a0000, #000000);
    color: #e6e6e6;
    font-family: 'Segoe UI', sans-serif;
    padding: 30px;
}
    
.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo svg text {
    font-size: 42px;
    font-weight: bold;
    fill: #8b0000;
    stroke: #ff0000;
    stroke-width: 1.5;
    letter-spacing: 3px;
    filter: drop-shadow(0 0 6px red);
}


textarea {
    width: 100%;
    height: 180px;
    background: #0b0000;
    color: #ffffff;
    border: 1px solid #5a0000;
    font-size: 14px;
    padding: 10px;
    outline: none;
}

textarea::placeholder {
    color: #777;
}


button {
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(45deg, #5a0000, #9b0000);
    border: none;
    color: white;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(255,0,0,0.4);
}

button:hover {
    background: linear-gradient(45deg, #9b0000, #ff0000);
}


table {
    margin-top: 25px;
    border-collapse: collapse;
    font-size: 12pt;
    width: 100%;
    font-family: "Aptos Serif", serif; 
    color: #000000;
    background: #ffffff;
}

td {
    padding: 2px 0;
    vertical-align: top;
}

.name {
    width: 75%;
}

.code {
    width: 25%;
    text-align: left;
}
</style>
</head>

<body>

<div class="logo">
<svg width="100%" height="60" viewBox="0 0 1200 60">
  <text x="50%" y="45" text-anchor="middle">
    CHARCHABIL LM9EWD
  </text>
</svg>
</div>

<textarea id="input" placeholder="DIR DIK L3AYBA LI KAT3RAF DIR DIMA CTRL+V"></textarea>
<br>
<button onclick="generate()">GENERATE</button>
<button onclick="copyResult()">COPY FOR OUTLOOK</button>

<div id="output"></div>

<script>
function generate() {
    const lines = document.getElementById("input").value
        .split("\n")
        .map(l => l.trim())
        .filter(l => l);

    let html = "<table>";
    let i = 1;

    lines.forEach(line => {
        line = line.replace(/^\d+\./, "").trim();
        const parts = line.split(/\s+/);
        const code = parts.pop();
        const name = parts.join(" ");

        html += `
        <tr>
            <td class="name">${i}. ${name}</td>
            <td class="code">${code}</td>
        </tr>`;
        i++;
    });

    html += "</table>";
    document.getElementById("output").innerHTML = html;
}

function copyResult() {
    const range = document.createRange();
    range.selectNode(document.getElementById("output"));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
    window.getSelection().removeAllRanges();
    alert("🩸 COPIED — Paste directly in Outlook.");
}
</script>

</body>
</html>
